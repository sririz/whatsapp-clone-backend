<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Messager - Register</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">💬</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join The Messager today</p>
            
            <form id="registerForm">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Password" 
                    required
                >
                
                <!-- NEW: Password Checklist -->
                <div class="password-checklist">
                    <small id="req-length" class="invalid">❌ At least 8 characters</small>
                    <small id="req-capital" class="invalid">❌ 1 Capital letter (A-Z)</small>
                    <small id="req-number" class="invalid">❌ 1 Number (0-9)</small>
                    <small id="req-special" class="invalid">❌ 1 Special character (!@#$%^&*)</small>
                </div>
                
                <button type="submit">Register</button>
            </form>
            
            <p class="switch-link">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>
    
    <script src="js/register.js"></script>
</body>
</html>
