<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Clone - Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="login-container">

    <div class="logo">
        💬
    </div>

    <h1> The Messager </h1>

    <p>Login to continue chatting</p>


    <form id="loginForm">

        <input 
        type="email" 
        id="email"
        placeholder="Email"
        required>


        <input 
        type="password"
        id="password" 
        placeholder="Password"
        required>


        <button type="submit">
            Login
        </button>


    </form>


    <p class="register-link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>


</div>


<script src="js/login.js"></script>

</body>

</html>
